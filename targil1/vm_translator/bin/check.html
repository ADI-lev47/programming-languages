תדביקו את זה בדף HTML 
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן זריזות ודיוק - שילוב אותיות ומספרים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            user-select: none;
        }
        .code-display {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .question-row:nth-child(even) {
            background-color: #f8fafc;
        }
        input[type="radio"] {
            transform: scale(1.5);
            cursor: pointer;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 p-2 md:p-8 flex flex-col items-center">


    <!-- Header -->
    <div class="w-full max-w-4xl bg-white border-b-4 border-indigo-600 rounded-t-2xl shadow-sm p-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl md:text-2xl font-extrabold text-slate-800">מבחן זריזות ודיוק (אלפא-נומרי)</h1>
            <p class="text-slate-500 text-xs md:text-sm">השוואת 55 זוגות של תווים ומספרים</p>
        </div>
        <div id="timer-container" class="flex items-center gap-3 px-6 py-2 rounded-xl font-mono text-2xl font-black bg-slate-800 text-white transition-all">
            <i data-lucide="timer"></i>
            <span id="timer-display">02:00</span>
        </div>
    </div>


    <!-- Main Content Area -->
    <div id="game-container" class="w-full max-w-4xl bg-white rounded-b-2xl shadow-xl min-h-[600px] p-4 md:p-8 overflow-y-auto">
        <!-- Content will be injected here -->
    </div>


    <script>
        // Constants
        const TOTAL_QUESTIONS = 55;
        const TEST_DURATION = 120; // 2 minutes
        const QUESTIONS_PER_PAGE = 11;
        const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        // State
        let gameState = 'START';
        let questions = [];
        let userAnswers = {};
        let timeLeft = TEST_DURATION;
        let timerInterval = null;
        let currentPage = 0;


        function initIcons() {
            lucide.createIcons();
        }


        function generatePairs() {
            const pairs = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const length = Math.floor(Math.random() * 3) + 8; // 8-10 chars
                let s1 = "";
                for (let j = 0; j < length; j++) {
                    s1 += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
                }
               
                const isIdentical = Math.random() > 0.5;
                let s2 = s1;
               
                if (!isIdentical) {
                    const pos = Math.floor(Math.random() * length);
                    const s2Array = s2.split('');
                    let newChar;
                    do {
                        newChar = CHARS.charAt(Math.floor(Math.random() * CHARS.length));
                    } while (newChar === s1[pos]);
                    s2Array[pos] = newChar;
                    s2 = s2Array.join('');
                }
                pairs.push({ s1, s2, isIdentical });
            }
            return pairs;
        }


        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) finishTest();
            }, 1000);
        }


        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            const container = document.getElementById('timer-container');
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
           
            if (timeLeft < 20) container.classList.add('bg-red-600', 'animate-pulse');
        }


        function startTest() {
            gameState = 'PLAYING';
            questions = generatePairs();
            userAnswers = {};
            timeLeft = TEST_DURATION;
            currentPage = 0;
            render();
            startTimer();
        }


        function selectAnswer(qIdx, val) {
            userAnswers[qIdx] = val;
        }


        function nextPage() {
            if ((currentPage + 1) * QUESTIONS_PER_PAGE < TOTAL_QUESTIONS) {
                currentPage++;
                render();
                window.scrollTo(0,0);
            } else {
                finishTest();
            }
        }


        function finishTest() {
            gameState = 'FINISHED';
            clearInterval(timerInterval);
            render();
        }


        function render() {
            const container = document.getElementById('game-container');
           
            if (gameState === 'START') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-12 text-center">
                        <div class="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-8">
                            <i data-lucide="play-circle" size="64"></i>
                        </div>
                        <h2 class="text-3xl font-bold mb-6">הוראות הסימולציה</h2>
                        <div class="bg-slate-50 p-6 rounded-2xl text-right max-w-xl mb-10 border border-slate-200">
                            <p class="mb-4">עליך להשוות בין רצפי תווים (אותיות ומספרים).</p>
                            <p class="mb-4 font-bold text-indigo-700 underline">קריטריון מעבר:</p>
                            <ul class="list-disc list-inside space-y-2 text-slate-700">
                                <li>מענה על לפחות <b>28 שאלות</b> בתוך 2 דקות.</li>
                                <li>מקסימום <b>3 טעויות</b> בלבד.</li>
                            </ul>
                        </div>
                        <button onclick="startTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold px-12 py-4 rounded-2xl transition-all shadow-xl hover:scale-105">
                            התחל מבחן
                        </button>
                    </div>
                `;
            } else if (gameState === 'PLAYING') {
                const startIdx = currentPage * QUESTIONS_PER_PAGE;
                const endIdx = Math.min(startIdx + QUESTIONS_PER_PAGE, TOTAL_QUESTIONS);
                const pageQuestions = questions.slice(startIdx, endIdx);


                let rowsHtml = pageQuestions.map((q, i) => {
                    const actualIdx = startIdx + i;
                    const selected = userAnswers[actualIdx];
                    return `
                        <div class="question-row grid grid-cols-12 gap-2 items-center p-4 border-b border-slate-100 hover:bg-indigo-50 transition-colors">
                            <div class="col-span-1 text-slate-400 font-bold text-sm">${actualIdx + 1}</div>
                            <div class="col-span-4 flex justify-center">
                                <span class="code-display text-lg tracking-tight">${q.s1}</span>
                            </div>
                            <div class="col-span-3 flex justify-center gap-8">
                                <label class="flex flex-col items-center cursor-pointer">
                                    <span class="text-[10px] text-slate-400 font-bold mb-1">זהה (=)</span>
                                    <input type="radio" name="q${actualIdx}" onchange="selectAnswer(${actualIdx}, true)" ${selected === true ? 'checked' : ''}>
                                </label>
                                <label class="flex flex-col items-center cursor-pointer">
                                    <span class="text-[10px] text-slate-400 font-bold mb-1">שונה (≠)</span>
                                    <input type="radio" name="q${actualIdx}" onchange="selectAnswer(${actualIdx}, false)" ${selected === false ? 'checked' : ''}>
                                </label>
                            </div>
                            <div class="col-span-4 flex justify-center">
                                <span class="code-display text-lg tracking-tight">${q.s2}</span>
                            </div>
                        </div>
                    `;
                }).join('');


                container.innerHTML = `
                    <div class="mb-6 flex justify-between items-end border-b pb-4">
                        <span class="text-slate-500 font-bold">דף ${currentPage + 1} מתוך 5</span>
                        <div class="h-2 w-48 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500" style="width: ${(currentPage + 1) * 20}%"></div>
                        </div>
                    </div>
                   
                    <div class="border rounded-xl overflow-hidden mb-8">
                        <div class="grid grid-cols-12 gap-2 bg-slate-800 text-white p-3 text-center text-xs font-bold uppercase tracking-wider">
                            <div class="col-span-1">#</div>
                            <div class="col-span-4">רצף א'</div>
                            <div class="col-span-3">זהה / שונה</div>
                            <div class="col-span-4">רצף ב'</div>
                        </div>
                        ${rowsHtml}
                    </div>


                    <div class="flex justify-center">
                        <button onclick="nextPage()" class="bg-slate-800 hover:bg-black text-white px-10 py-4 rounded-xl font-bold flex items-center gap-2 transition-all">
                            ${currentPage === 4 ? 'סיום והצגת תוצאות' : 'לדף הבא'}
                            <i data-lucide="chevron-left"></i>
                        </button>
                    </div>
                `;
            } else if (gameState === 'FINISHED') {
                let answeredCount = Object.keys(userAnswers).length;
                let correctCount = 0;
                let errorsCount = 0;
                const errorsList = [];


                questions.forEach((q, idx) => {
                    const userAns = userAnswers[idx];
                    if (userAns !== undefined) {
                        if (userAns === q.isIdentical) {
                            correctCount++;
                        } else {
                            errorsCount++;
                            errorsList.push({ idx: idx + 1, q, userAns });
                        }
                    }
                });


                const passed = answeredCount >= 28 && errorsCount <= 3;


                container.innerHTML = `
                    <div class="text-center py-6">
                        <div class="mb-6">
                            ${passed
                                ? '<div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full mb-4"><i data-lucide="check-circle" size="48"></i></div>'
                                : '<div class="inline-flex items-center justify-center w-20 h-20 bg-red-100 text-red-600 rounded-full mb-4"><i data-lucide="x-circle" size="48"></i></div>'
                            }
                            <h2 class="text-4xl font-black ${passed ? 'text-emerald-600' : 'text-red-600'}">
                                ${passed ? 'עברת!' : 'לא עברת'}
                            </h2>
                        </div>


                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 max-w-2xl mx-auto">
                            <div class="bg-slate-50 p-4 rounded-2xl border">
                                <p class="text-xs text-slate-500 font-bold mb-1 uppercase">נענו</p>
                                <p class="text-3xl font-black ${answeredCount >= 28 ? 'text-indigo-600' : 'text-red-500'}">${answeredCount}</p>
                                <p class="text-[10px] text-slate-400 mt-1">יעד: 28+</p>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border">
                                <p class="text-xs text-slate-500 font-bold mb-1 uppercase">טעויות</p>
                                <p class="text-3xl font-black ${errorsCount <= 3 ? 'text-emerald-500' : 'text-red-600'}">${errorsCount}</p>
                                <p class="text-[10px] text-slate-400 mt-1">מותר: עד 3</p>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border">
                                <p class="text-xs text-slate-500 font-bold mb-1 uppercase">זמן שנותר</p>
                                <p class="text-3xl font-black text-slate-800">${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2, '0')}</p>
                                <p class="text-[10px] text-slate-400 mt-1">מתוך 02:00</p>
                            </div>
                        </div>


                        ${errorsCount > 0 ? `
                            <div class="text-right max-w-2xl mx-auto mb-8">
                                <h3 class="text-lg font-bold mb-3 flex items-center gap-2 text-red-600"><i data-lucide="alert-triangle" size="20"></i> שגיאות לשיפור:</h3>
                                <div class="space-y-2">
                                    ${errorsList.map(err => `
                                        <div class="p-3 bg-red-50 border border-red-100 rounded-xl flex justify-between items-center text-sm">
                                            <span class="font-bold text-red-700">#${err.idx}</span>
                                            <div class="flex gap-4 font-mono">
                                                <span>${err.q.s1}</span>
                                                <span class="text-slate-300">|</span>
                                                <span>${err.q.s2}</span>
                                            </div>
                                            <div class="flex flex-col text-[10px] text-left">
                                                <span>בחרת: ${err.userAns ? '=' : '≠'}</span>
                                                <span class="font-bold">נכון: ${err.q.isIdentical ? '=' : '≠'}</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}


                        <button onclick="startTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-12 py-4 rounded-2xl font-bold transition-all shadow-lg">
                            ניסיון נוסף
                        </button>
                    </div>
                `;
            }
            initIcons();
        }


        render();
    </script>
</body>
</html>
